<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquête boissons</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2733;--muted:#5b6876;--accent:#0b6bcb;--line:#dde3ea;--soft:#eef4fb}
@media (prefers-color-scheme:dark){:root{--bg:#11161c;--card:#1a2129;--ink:#e6edf3;--muted:#9aa7b4;--accent:#4ea1ff;--line:#2d3742;--soft:#1f2a36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:1.3rem;margin:0 0 12px}
.q{font-weight:600;margin:20px 0 8px}
.q b{color:var(--accent)}
label.opt{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.err{color:#d1242f;margin-top:10px;min-height:1.2em}
.bottle{display:flex;justify-content:center;margin:12px 0}
.concept{font-style:italic;border-left:3px solid var(--accent);padding-left:12px}
.muted{color:var(--muted);font-size:.85rem}
/* Gauges (Q5-Q8 and Q11-Q15): white track and white thumb on a blue panel */
.gauge{background:#fff;border:1px solid #e6ebf1;border-radius:12px;padding:18px 20px 14px;box-shadow:0 1px 3px #0000000d;color:#1d2733}
.gauge .val{font-size:1.25rem;font-weight:700;color:#1b2a55}
.gauge .val.unset{color:#6b7480;font-size:1rem;font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;margin:16px 0 10px;cursor:pointer;
  background:linear-gradient(90deg,#b9dcf2,#4a90d9 45%,#1b2a55)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;cursor:grab;
  background:radial-gradient(circle,#1b2a55 0 4px,#fff 5px);border:1px solid #cfd6de;box-shadow:0 2px 6px #0002}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;cursor:grab;
  background:radial-gradient(circle,#1b2a55 0 4px,#fff 5px);border:1px solid #cfd6de;box-shadow:0 2px 6px #0002}
.gauge .scale{color:#6b7480;font-size:.85rem}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
/* Likert */
.lk{border-top:1px solid var(--line);padding:16px 0 4px}
.lk:first-of-type{border-top:0}
.lk .stmt{font-weight:600;margin-bottom:4px}
.ggrow .q{font-weight:500;margin:14px 0 6px}
.ggrow label.opt{display:inline-block;margin:3px 4px 3px 0;padding:6px 10px;font-size:.9rem}
.ggrow label.opt input{display:none}
.end{text-align:center;padding:12px 0}
.end .big{font-size:2.4rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
// Concept texts: only the collagen origin differs between A and B.
const CONCEPT = {
  A: "Eau minérale naturelle enrichie en actifs végétaux qui soutiennent la production naturelle de collagène (vitamine C, silicium…), sans ingrédient d’origine animale. 50 cl.",
  B: "Eau minérale naturelle enrichie en collagène d’origine bovine (peptides de collagène). 50 cl."
};
const GG_PRICES = [3.50, 2.90, 2.40, 1.90, 1.50];
const GG_SCALE = ["Certainement", "Probablement", "Je ne sais pas", "Probablement pas", "Certainement pas"];
const LIKERT = ["Pas du tout d’accord", "Plutôt pas d’accord", "Ni d’accord ni pas d’accord", "Plutôt d’accord", "Tout à fait d’accord"];
const LIKERT_ITEMS = [
  ["L1", "Ce produit est de bonne qualité."],
  ["L2", "Ce produit est bon pour ma santé."],
  ["L3", "Je fais confiance à l’efficacité de ce produit."],
  ["L4", "Ce produit correspond à mes valeurs (éthique, environnement)."],
  ["L5", "Ce produit me paraît naturel."]
];
const VW_ITEMS = [
  ["P1", "À partir de quel prix trouveriez-vous ce produit trop cher au point de ne pas l’acheter ?"],
  ["P2", "À partir de quel prix le trouveriez-vous cher, tout en envisageant de l’acheter ?"],
  ["P3", "À quel prix le trouveriez-vous bon marché, une bonne affaire ?"],
  ["P4", "À partir de quel prix le trouveriez-vous trop bon marché au point de douter de sa qualité ?"]
];
const STORE = "enquete_collagene_reponses";
// Admin tools (export CSV, counter, new respondent) only shown with #admin in the URL.
const ADMIN = location.hash === "#admin";

const BOTTLE = `<svg width="130" height="260" viewBox="0 0 130 260" aria-label="Bouteille 50 cl">
<defs>
  <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset=".45" stop-color="#e8f7ff"/><stop offset="1" stop-color="#6cc0f5"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0ff" stop-opacity=".55"/><stop offset="1" stop-color="#1f8be0" stop-opacity=".75"/></linearGradient>
  <linearGradient id="cap" x1="0" x2="1"><stop offset="0" stop-color="#0d5fb8"/><stop offset=".5" stop-color="#3d93ec"/><stop offset="1" stop-color="#0d5fb8"/></linearGradient>
  <linearGradient id="label" x1="0" x2="1"><stop offset="0" stop-color="#fdf7ff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#f1e9fb"/></linearGradient>
  <clipPath id="body"><path d="M50 30 h30 v16 q22 16 22 44 v138 q0 20 -20 20 h-34 q-20 0 -20 -20 v-138 q0 -28 22 -44z"/></clipPath>
</defs>
<ellipse cx="65" cy="252" rx="42" ry="6" fill="#0003"/>
<rect x="47" y="6" width="36" height="26" rx="5" fill="url(#cap)"/>
<g fill="#ffffff55"><rect x="52" y="9" width="2" height="20"/><rect x="58" y="9" width="2" height="20"/><rect x="64" y="9" width="2" height="20"/><rect x="70" y="9" width="2" height="20"/><rect x="76" y="9" width="2" height="20"/></g>
<path d="M50 30 h30 v16 q22 16 22 44 v138 q0 20 -20 20 h-34 q-20 0 -20 -20 v-138 q0 -28 22 -44z" fill="url(#glass)" stroke="#4aa8ea" stroke-width="2"/>
<g clip-path="url(#body)">
  <path d="M20 96 q15 -8 30 0 t30 0 t30 0 v170 h-90z" fill="url(#water)"/>
  <g fill="#fff" opacity=".7"><circle cx="45" cy="210" r="3"/><circle cx="80" cy="190" r="2"/><circle cx="55" cy="170" r="2.5"/><circle cx="85" cy="225" r="3.5"/><circle cx="40" cy="140" r="1.8"/></g>
  <rect x="28" y="60" width="7" height="170" rx="3.5" fill="#fff" opacity=".55"/>
</g>
<rect x="22" y="118" width="86" height="70" rx="6" fill="url(#label)" stroke="#c9b6ea"/>
<path d="M65 127 q-10 12 -10 18 a10 10 0 0 0 20 0 q0 -6 -10 -18z" fill="#3d93ec"/><path d="M60 146 a5 5 0 0 0 5 5" stroke="#fff" stroke-width="1.5" fill="none"/>
<text x="65" y="166" font-family="Georgia,serif" font-size="12" font-style="italic" text-anchor="middle" fill="#3a2a5d">Collagène</text>
<text x="65" y="180" font-family="system-ui,sans-serif" font-size="7" text-anchor="middle" fill="#7a6a9a">EAU MINÉRALE · 50 CL</text>
</svg>`;

let r, history;

function load() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } }
function save(list) { try { localStorage.setItem(STORE, JSON.stringify(list)); } catch {} }
const euro = (v, d = 3) => Number(v).toFixed(d).replace(".", ",") + " €";

// Unbiased random integer in [0, n) from the crypto RNG.
function randInt(n) { const a = new Uint32Array(1), lim = Math.floor(2 ** 32 / n) * n;
  do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; }
// Block randomisation: each block of 4 openings holds 2 A and 2 B in random order,
// so on a given device the split never drifts by more than 2. Falls back to a coin flip.
function assignVersion() {
  const KEY = "enquete_collagene_bloc";
  try {
    let bloc = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (!bloc.length) { bloc = ["A", "A", "B", "B"];
      for (let i = bloc.length - 1; i > 0; i--) { const j = randInt(i + 1); [bloc[i], bloc[j]] = [bloc[j], bloc[i]]; } }
    const v = bloc.shift(); localStorage.setItem(KEY, JSON.stringify(bloc)); return v;
  } catch { return randInt(2) ? "A" : "B"; }
}

function start() {
  r = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        version: assignVersion(), debut: new Date().toISOString(), statut: "en cours" };
  history = [];
  go("accueil", false);
}

function finish(statut) {
  r.statut = statut; r.fin = new Date().toISOString();
  const list = load(); list.push(r); save(list);
  const msg = statut === "complet"
    ? `<div class="big">🙏</div><h1>Merci infiniment !</h1>
       <p>Vos réponses sont précieuses : elles vont directement nourrir notre étude et nous aider à mieux comprendre ce qui compte vraiment pour les consommateurs.</p>
       <p>Merci d’avoir pris ces quelques minutes, c’est grâce à des participants comme vous que cette enquête peut aboutir. Belle journée !</p>`
    : `<div class="big">🙏</div><h1>Merci pour votre intérêt !</h1>
       <p>Cette enquête s’adresse à un profil un peu différent, elle s’arrête donc ici. Merci beaucoup pour le temps que vous nous avez accordé.</p>`;
  render(`<div class="end">${msg}</div>` + (ADMIN ? `<div class="nav"><button onclick="start()">Nouveau répondant</button>
    <button class="sec" onclick="exportCSV()">Exporter (CSV)</button></div>
    <p class="muted">${load().length} réponse(s) enregistrée(s) sur cet appareil.</p>` : ""));
}

function render(html) { document.getElementById("app").innerHTML = `<div class="card">${html}</div>`; window.scrollTo(0, 0); }

function radios(name, opts, sel) {
  return opts.map(o => `<label class="opt"><input type="radio" name="${name}" value="${o}"${o === sel ? " checked" : ""}> ${o}</label>`).join("");
}
function val(name) { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : null; }
const Q = (n, t) => `<div class="q"><b>Q${n}.</b> ${t}</div>`;

// A slider starts "unset" until moved; previously given answers are restored.
function priceGauge(k) {
  const set = r[k] != null;
  return `<div class="gauge"><div class="val${set ? "" : " unset"}" id="v_${k}">${set ? euro(r[k], 2) : "Déplacez le curseur"}</div>
    <input type="range" name="${k}" min="0" max="5" step="0.1" value="${set ? r[k] : 0}" class="${set ? "" : "unset"}"
      oninput="this.classList.remove('unset');this.dataset.set=1;const v=document.getElementById('v_${k}');v.classList.remove('unset');v.textContent=euro(this.value, 2)"
      ${set ? 'data-set="1"' : ""}>
    <div class="scale"><span>0 €</span><span>1 €</span><span>2 €</span><span>3 €</span><span>4 €</span><span>5 €</span></div></div>`;
}
function likertGauge(k, text, n) {
  const set = r[k] != null && r[k] !== "";
  return `<div class="lk">${Q(n, text)}<div class="gauge"><div class="val${set ? "" : " unset"}" id="v_${k}">${set ? LIKERT[r[k] - 1] : "Déplacez le curseur"}</div>
    <input type="range" class="${set ? "" : "unset"}" name="${k}" min="1" max="5" step="1" value="${set ? r[k] : 3}"
      oninput="this.classList.remove('unset');this.dataset.set=1;const v=document.getElementById('v_${k}');v.classList.remove('unset');v.textContent=LIKERT[this.value-1]"
      ${set ? 'data-set="1"' : ""}>
    <div class="scale"><span>Pas du tout d’accord</span><span>Tout à fait d’accord</span></div></div></div>`;
}
const ggKey = p => "G_" + p.toFixed(2);
const positive = v => v === "Certainement" || v === "Probablement";
function ggRefresh() {
  let show = true;
  GG_PRICES.forEach((p, i) => { document.getElementById("gg" + i).hidden = !show;
    const v = val(ggKey(p)); show = show && !!v && !positive(v); });
}
function slider(name) { const e = document.querySelector(`input[name="${name}"]`); return e.dataset.set ? Number(e.value) : null; }

function go(name, push = true) {
  if (push) history.push(current);
  current = name;
  const s = screens[name];
  render(s.html() + `<div class="err" id="err"></div><div class="nav">
    ${history.length ? `<button class="sec" id="prev">← Précédent</button>` : "<span></span>"}<button id="next">Suivant →</button></div>`);
  if (s.after) s.after();
  document.getElementById("next").onclick = () => { const e = s.next(); if (e) document.getElementById("err").textContent = e; };
  const prev = document.getElementById("prev");
  if (prev) prev.onclick = () => { keep(); go(history.pop(), false); };
}
let current;

// Store whatever is filled on the current screen (no validation) so "Précédent" never loses an answer.
const KEYS = { consent: "consentement", genre: "genre", regime: "regime", depense: "depense_50cl" };
function keep() {
  document.querySelectorAll("input[type=radio]:checked").forEach(e => r[KEYS[e.name] || e.name] = e.value);
  document.querySelectorAll("input[type=range][data-set]").forEach(e => r[e.name] = Number(e.value));
}

const screens = {
  accueil: {
    html: () => `<h1>Enquête</h1><p>Cette enquête porte sur les boissons. Elle dure environ 5 minutes. Vos réponses sont anonymes et utilisées uniquement à des fins d’étude.</p>
      ${Q(1, "Acceptez-vous de participer ?")}${radios("consent", ["Oui", "Non"], r.consentement)}`,
    next: () => { const v = val("consent"); if (!v) return "Merci de répondre.";
      r.consentement = v; v === "Non" ? finish("refus") : go("filtre"); }
  },
  filtre: {
    html: () => `${Q(2, "Au cours des 3 derniers mois, avez-vous acheté de l’eau en bouteille ?")}${radios("F1", ["Oui", "Non"], r.F1)}
      ${Q(3, "Au cours des 3 derniers mois, avez-vous acheté au moins une fois une boisson ou un complément enrichi (vitamines, protéines, collagène…) ? <span class='muted'>Les boissons énergisantes (type Red Bull, Monster) ne sont pas concernées.</span>")}${radios("F2", ["Oui", "Non"], r.F2)}
      ${Q(4, "Votre âge :")}${radios("F3", ["Moins de 18 ans", "18-24", "25-34", "35-49", "50 ans et plus"], r.F3)}`,
    next: () => { const f1 = val("F1"), f2 = val("F2"), f3 = val("F3");
      if (!f1 || !f2 || !f3) return "Merci de répondre à toutes les questions.";
      Object.assign(r, { F1: f1, F2: f2, F3: f3 });
      f1 === "Non" ? finish("hors cible") : go("offre"); }
  },
  offre: {
    html: () => `<p>Voici un nouveau produit. <strong>Voici sa description, merci de la lire attentivement :</strong></p>
      <div class="bottle">${BOTTLE}</div><p class="concept">« ${CONCEPT[r.version]} »</p>`,
    next: () => go("vw")
  },
  vw: {
    html: () => `<p class="concept">« ${CONCEPT[r.version]} »</p><p class="muted">Faites glisser chaque curseur jusqu’au prix qui vous correspond (de 0 à 5 €, par pas de 10 centimes).</p>
      ${VW_ITEMS.map(([k, t], i) => Q(5 + i, t) + priceGauge(k)).join("")}`,
    next: () => { const p = VW_ITEMS.map(([k]) => slider(k));
      if (p.some(x => x === null)) return "Merci de placer chaque curseur sur un prix.";
      if (!(p[0] >= p[1] && p[1] >= p[2] && p[2] >= p[3]))
        return "Vos prix semblent incohérents : « trop cher » ≥ « cher » ≥ « bonne affaire » ≥ « trop bon marché ».";
      [r.P1, r.P2, r.P3, r.P4] = p; go("gg"); }
  },
  gg: {
    // Gabor-Granger on one page: next (lower) price appears only while the answer is not positive.
    html: () => `<p class="concept">« ${CONCEPT[r.version]} »</p>${Q(9, "Achèteriez-vous ce produit aux prix suivants ?")}
      ${GG_PRICES.map((p, i) => `<div class="ggrow" id="gg${i}"><div class="q">${String.fromCharCode(97 + i)}) Si ce produit coûtait ${euro(p, 2)}, l’achèteriez-vous ?</div>
        ${radios(ggKey(p), GG_SCALE, r[ggKey(p)])}</div>`).join("")}`,
    after: () => { document.querySelectorAll(".ggrow input").forEach(e => e.onchange = ggRefresh); ggRefresh(); },
    next: () => { const shown = GG_PRICES.filter((p, i) => !document.getElementById("gg" + i).hidden);
      const last = shown[shown.length - 1], v = val(ggKey(last));
      if (!v) return "Merci de répondre.";
      GG_PRICES.forEach(p => r[ggKey(p)] = shown.includes(p) ? val(ggKey(p)) : "");
      r.GG_prix_accepte = positive(v) ? last : ""; go("controle"); }
  },
  controle: {
    html: () => `${Q(10, "D’après la description, d’où provenait le collagène, ou ce qui le soutient, dans ce produit ?")}
      ${radios("C1", ["Origine végétale", "Origine animale (bovine)", "Origine marine", "Je ne sais pas"], r.C1)}`,
    next: () => { const v = val("C1"); if (!v) return "Merci de répondre.";
      r.C1 = v; r.controle_ok = (r.version === "A" ? v === "Origine végétale" : v === "Origine animale (bovine)") ? 1 : 0;
      go("perception"); }
  },
  perception: {
    html: () => `<p>Dans quelle mesure êtes-vous d’accord avec les affirmations suivantes ?</p>
      ${LIKERT_ITEMS.map(([k, t], i) => likertGauge(k, t, 11 + i)).join("")}`,
    next: () => { const v = LIKERT_ITEMS.map(([k]) => slider(k));
      if (v.some(x => x === null)) return "Merci de placer chaque curseur.";
      LIKERT_ITEMS.forEach(([k], i) => r[k] = v[i]); go("profil"); }
  },
  profil: {
    html: () => `${Q(16, "Vous êtes :")}${radios("genre", ["Une femme", "Un homme", "Autre", "Je préfère ne pas répondre"], r.genre)}
      ${Q(17, "Quel est votre régime alimentaire ?")}${radios("regime", ["Omnivore", "Flexitarien", "Végétarien", "Végan"], r.regime)}
      ${Q(18, "Combien dépensez-vous habituellement pour une bouteille d’eau de 50 cl ?")}${radios("depense", ["< 0,50 €", "0,50–1 €", "1–2 €", "> 2 €"], r.depense_50cl)}`,
    next: () => { const g = val("genre"), d = val("regime"), e = val("depense");
      if (!g || !d || !e) return "Merci de répondre à toutes les questions.";
      Object.assign(r, { genre: g, regime: d, depense_50cl: e }); finish("complet"); }
  }
};

function exportCSV() {
  // Q10: correct answers first, then wrong ones, then incomplete questionnaires.
  const rank = x => x.controle_ok === 1 ? 0 : x.controle_ok === 0 ? 1 : 2;
  const list = load().map(x => ({ ...x, groupe_controle: ["Bonne réponse Q10", "Erreur Q10", "Non atteint"][rank(x)] }))
    .sort((a, b) => rank(a) - rank(b));
  if (!list.length) return;
  const cols = ["id", "version", "statut", "debut", "fin", "consentement", "F1", "F2", "F3", "P1", "P2", "P3", "P4",
    ...GG_PRICES.map(ggKey), "GG_prix_accepte", "C1", "controle_ok", "groupe_controle", "L1", "L2", "L3", "L4", "L5",
    "genre", "regime", "depense_50cl"];
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "﻿" + [cols.join(";"), ...list.map(x => cols.map(c => esc(x[c])).join(";"))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "reponses_enquete_collagene.csv"; a.click();
}

start();
</script>
</body>
</html>
