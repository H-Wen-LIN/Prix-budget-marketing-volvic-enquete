<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquête boissons</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#1d2733;--muted:#5b6876;--accent:#0b6bcb;--line:#d8dee4}
@media (prefers-color-scheme:dark){:root{--bg:#11161c;--card:#1a2129;--ink:#e6edf3;--muted:#9aa7b4;--accent:#4ea1ff;--line:#2d3742}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:1.3rem;margin:0 0 12px}
.q{font-weight:600;margin:16px 0 8px}
label.opt{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent)}
input[type=number]{width:120px;padding:8px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer;margin-top:16px}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.err{color:#d1242f;margin-top:8px;min-height:1.2em}
.bottle{display:flex;justify-content:center;margin:12px 0}
.concept{font-style:italic;border-left:3px solid var(--accent);padding-left:12px}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:.8rem;text-align:center}
.likert label{border:1px solid var(--line);border-radius:6px;padding:6px 2px;cursor:pointer}
.likert label:has(input:checked){border-color:var(--accent)}
.muted{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
// Concept texts: only the collagen origin differs between A and B.
const CONCEPT = {
  A: "Eau minérale naturelle enrichie en actifs végétaux qui soutiennent la production naturelle de collagène (vitamine C, silicium…), sans ingrédient d’origine animale. 50 cl.",
  B: "Eau minérale naturelle enrichie en collagène d’origine bovine (peptides de collagène). 50 cl."
};
const GG_PRICES = [3.50, 2.90, 2.40, 1.90, 1.50];
const GG_SCALE = ["Certainement", "Probablement", "Je ne sais pas", "Probablement pas", "Certainement pas"];
const LIKERT = ["Pas du tout d’accord", "Plutôt pas d’accord", "Ni l’un ni l’autre", "Plutôt d’accord", "Tout à fait d’accord"];
const STORE = "enquete_collagene_reponses";

const BOTTLE = `<svg width="70" height="170" viewBox="0 0 70 170" aria-label="Bouteille 50 cl">
<rect x="27" y="4" width="16" height="14" rx="2" fill="#5b8fd6"/>
<path d="M27 18 h16 v12 q12 10 12 26 v100 q0 10 -10 10 h-20 q-10 0 -10 -10 v-100 q0 -16 12 -26z" fill="#cfe5ff" stroke="#5b8fd6" stroke-width="2"/>
<rect x="15" y="70" width="40" height="44" fill="#fff" stroke="#5b8fd6"/>
<text x="35" y="96" font-size="11" text-anchor="middle" fill="#1d2733">50 cl</text></svg>`;

let r, ggIndex;

function load() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } }
function save(list) { try { localStorage.setItem(STORE, JSON.stringify(list)); } catch {} }

function start() {
  r = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        version: Math.random() < 0.5 ? "A" : "B", debut: new Date().toISOString(), statut: "en cours" };
  ggIndex = 0;
  show(screens.accueil);
}

function finish(statut) {
  r.statut = statut; r.fin = new Date().toISOString();
  const list = load(); list.push(r); save(list);
  render(`<h1>${statut === "complet" ? "Merci pour votre participation !" : "Merci, l’enquête s’arrête ici."}</h1>
    <button onclick="start()">Nouveau répondant</button>
    <button class="sec" onclick="exportCSV()">Exporter les réponses (CSV)</button>
    <p class="muted">${load().length} réponse(s) enregistrée(s) sur cet appareil.</p>`);
}

function render(html) { document.getElementById("app").innerHTML = `<div class="card">${html}</div>`; window.scrollTo(0, 0); }

function radios(name, opts) {
  return opts.map(o => `<label class="opt"><input type="radio" name="${name}" value="${o}"> ${o}</label>`).join("");
}
function likert(name, text) {
  return `<div class="q">${text}</div><div class="likert">${LIKERT.map((l, i) =>
    `<label><input type="radio" name="${name}" value="${i + 1}"><br>${l}</label>`).join("")}</div>`;
}
function val(name) { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : null; }
function num(name) { const v = document.querySelector(`input[name="${name}"]`).value.replace(",", "."); return v === "" ? null : Number(v); }

// Each screen: html() + next() returning error string or undefined.
function show(s) {
  render(s.html() + `<div class="err" id="err"></div><button id="next">Suivant</button>`);
  document.getElementById("next").onclick = () => {
    const e = s.next(); if (e) document.getElementById("err").textContent = e;
  };
}

const screens = {
  accueil: {
    html: () => `<h1>Enquête</h1><p>Cette enquête porte sur les boissons. Elle dure environ 5 minutes. Vos réponses sont anonymes et utilisées uniquement à des fins d’étude.</p>
      <div class="q">Acceptez-vous de participer ?</div>${radios("consent", ["Oui", "Non"])}`,
    next: () => { const v = val("consent"); if (!v) return "Merci de répondre.";
      r.consentement = v; v === "Non" ? finish("refus") : show(screens.filtre); }
  },
  filtre: {
    html: () => `<div class="q">F1. Au cours des 3 derniers mois, avez-vous acheté de l’eau en bouteille ?</div>${radios("F1", ["Oui", "Non"])}
      <div class="q">F2. Au cours des 3 derniers mois, avez-vous acheté au moins une fois une boisson ou un complément « fonctionnel » (vitamines, protéines, collagène…) ?</div>${radios("F2", ["Oui", "Non"])}
      <div class="q">F3. Votre âge :</div>${radios("F3", ["Moins de 18 ans", "18-24", "25-34", "35-49", "50 ans et plus"])}`,
    next: () => { const f1 = val("F1"), f2 = val("F2"), f3 = val("F3");
      if (!f1 || !f2 || !f3) return "Merci de répondre à toutes les questions.";
      Object.assign(r, { F1: f1, F2: f2, F3: f3 });
      (f1 === "Non" || f3 === "Moins de 18 ans") ? finish("hors cible") : show(screens.offre); }
  },
  offre: {
    html: () => `<p>Voici un nouveau produit. Merci de lire attentivement sa description.</p>
      <div class="bottle">${BOTTLE}</div><p class="concept">« ${CONCEPT[r.version]} »</p>`,
    next: () => show(screens.vw)
  },
  vw: {
    html: () => `<p class="concept">« ${CONCEPT[r.version]} »</p><p class="muted">Indiquez un prix en euros (ex. 1,80).</p>
      ${[["P1", "À partir de quel prix trouveriez-vous ce produit trop cher au point de ne pas l’acheter ?"],
         ["P2", "À partir de quel prix le trouveriez-vous cher, tout en envisageant de l’acheter ?"],
         ["P3", "À quel prix le trouveriez-vous bon marché, une bonne affaire ?"],
         ["P4", "À partir de quel prix le trouveriez-vous trop bon marché au point de douter de sa qualité ?"]]
        .map(([k, t]) => `<div class="q">${k}. ${t}</div><input type="number" name="${k}" min="0" step="0.01" inputmode="decimal"> €`).join("")}`,
    next: () => { const p = ["P1", "P2", "P3", "P4"].map(num);
      if (p.some(x => x === null || isNaN(x) || x < 0)) return "Merci d’indiquer un prix pour chaque question.";
      if (!(p[0] >= p[1] && p[1] >= p[2] && p[2] >= p[3]))
        return "Vos prix semblent incohérents : « trop cher » ≥ « cher » ≥ « bonne affaire » ≥ « trop bon marché ».";
      [r.P1, r.P2, r.P3, r.P4] = p; show(screens.gg); }
  },
  gg: {
    html: () => `<p class="concept">« ${CONCEPT[r.version]} »</p>
      <div class="q">G${ggIndex + 1}. Si ce produit coûtait ${GG_PRICES[ggIndex].toFixed(2).replace(".", ",")} €, l’achèteriez-vous ?</div>${radios("gg", GG_SCALE)}`,
    next: () => { const v = val("gg"); if (!v) return "Merci de répondre.";
      r["G_" + GG_PRICES[ggIndex].toFixed(2)] = v;
      const positive = v === "Certainement" || v === "Probablement";
      if (positive) { r.GG_prix_accepte = GG_PRICES[ggIndex]; show(screens.controle); }
      else if (++ggIndex < GG_PRICES.length) show(screens.gg);
      else { r.GG_prix_accepte = ""; show(screens.controle); } }
  },
  controle: {
    html: () => `<div class="q">C1. D’après la description, d’où provenait le collagène, ou ce qui le soutient, dans ce produit ?</div>
      ${radios("C1", ["Origine végétale", "Origine animale (bovine)", "Origine marine", "Je ne sais pas"])}`,
    next: () => { const v = val("C1"); if (!v) return "Merci de répondre.";
      r.C1 = v; r.controle_ok = (r.version === "A" ? v === "Origine végétale" : v === "Origine animale (bovine)") ? 1 : 0;
      show(screens.perception); }
  },
  perception: {
    html: () => `<p>Dans quelle mesure êtes-vous d’accord avec les affirmations suivantes ? <span class="muted">(facultatif)</span></p>
      ${likert("L1", "L1. Ce produit est de bonne qualité.")}${likert("L2", "L2. Ce produit vaut son prix.")}
      ${likert("L3", "L3. Je fais confiance à l’efficacité de ce produit.")}${likert("L4", "L4. Ce produit correspond à mes valeurs (éthique, environnement).")}
      ${likert("L5", "L5. Ce produit me paraît naturel.")}`,
    next: () => { ["L1", "L2", "L3", "L4", "L5"].forEach(k => r[k] = val(k) || ""); show(screens.profil); }
  },
  profil: {
    html: () => `<div class="q">Genre</div>${radios("genre", ["Femme", "Homme", "Autre", "Je préfère ne pas répondre"])}
      <div class="q">Régime alimentaire</div>${radios("regime", ["Omnivore", "Flexitarien", "Végétarien", "Végan"])}
      <div class="q">Dépense habituelle pour une bouteille d’eau de 50 cl</div>${radios("depense", ["< 0,50 €", "0,50–1 €", "1–2 €", "> 2 €"])}`,
    next: () => { const g = val("genre"), d = val("regime"), e = val("depense");
      if (!g || !d || !e) return "Merci de répondre à toutes les questions.";
      Object.assign(r, { genre: g, regime: d, depense_50cl: e }); finish("complet"); }
  }
};

function exportCSV() {
  const list = load(); if (!list.length) return;
  const cols = ["id", "version", "statut", "debut", "fin", "consentement", "F1", "F2", "F3", "P1", "P2", "P3", "P4",
    ...GG_PRICES.map(p => "G_" + p.toFixed(2)), "GG_prix_accepte", "C1", "controle_ok", "L1", "L2", "L3", "L4", "L5",
    "genre", "regime", "depense_50cl"];
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "﻿" + [cols.join(";"), ...list.map(x => cols.map(c => esc(x[c])).join(";"))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "reponses_enquete_collagene.csv"; a.click();
}

start();
</script>
</body>
</html>
