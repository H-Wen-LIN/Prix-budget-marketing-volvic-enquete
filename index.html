<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00573f">
<title>Enquête boissons</title>
<style>
/* Visual identity inspired by the classic Volvic packaging: deep volcanic green + white, light leaf-green tints. */
:root{
  --bg:#f3f7f4; --card:#ffffff; --ink:#173326; --muted:#5a6f63;
  --green:#00573f; --green-2:#0d7a52; --leaf:#8cc63f; --soft:#e9f3ec; --line:#d6e4da;
  --track:linear-gradient(90deg,#cfe7c0,#3f9a5e 50%,#00573f); --danger:#b42318; --on-green:#ffffff;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1712; --card:#13241c; --ink:#e3efe7; --muted:#9db3a6;
  --green:#5cc48a; --green-2:#7fd6a3; --leaf:#a5d86a; --soft:#1a3127; --line:#284437;
  --track:linear-gradient(90deg,#2a4a39,#3f9a5e 50%,#7fd6a3); --danger:#ff8a80; --on-green:#0c1712;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg) radial-gradient(120% 60% at 50% 0%,var(--soft),transparent 70%) no-repeat}
main{max-width:640px;margin:0 auto;padding:20px 16px 32px}
/* Progress indicator */
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 2px 14px}
.progress span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--leaf),var(--green));transition:width .35s ease}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:16px;padding:24px;
  box-shadow:0 6px 24px #00573f14}
h1{font-size:1.35rem;margin:0 0 12px;color:var(--green)}
.q{font-weight:600;margin:22px 0 10px}
.q b{color:var(--green)}
label.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;
  cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
label.opt:hover{border-color:var(--green-2)}
label.opt input{accent-color:var(--green);width:18px;height:18px;margin:0}
label.opt:has(input:checked){border-color:var(--green);background:var(--soft);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
button{background:var(--green);color:var(--on-green);border:0;border-radius:999px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer;
  transition:background .15s,transform .05s}
button:hover{background:var(--green-2)}
button:active{transform:translateY(1px)}
button:focus-visible,label.opt:focus-within,input[type=range]:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
button.sec{background:transparent;color:var(--green);border:1.5px solid var(--green)}
button.sec:hover{background:var(--soft)}
.err{color:var(--danger);margin-top:12px;min-height:1.2em;font-weight:500}
.bottle{display:flex;justify-content:center;margin:14px 0;padding:16px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.bottle img.hero{max-height:380px;max-width:100%;height:auto}
.concept-box{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.concept-box img.thumb{height:110px;width:auto;flex:none;border-radius:10px;background:#fff;padding:4px}
.concept-box .concept{margin:0}
.concept{font-style:italic;border-left:3px solid var(--green);padding-left:12px}
.muted{color:var(--muted);font-size:.86rem}
/* Gauges: big value between − / + buttons, clean track, labels only at both ends */
.gauge{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px 12px}
.gauge .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gauge .val{flex:1;text-align:center;font-size:1.3rem;font-weight:700;color:var(--green)}
.gauge .val.unset{color:var(--muted);font-size:.95rem;font-weight:400}
.step{width:42px;height:42px;flex:none;border-radius:50%;padding:0;font-size:1.35rem;line-height:1;background:var(--soft);color:var(--green);border:1.5px solid var(--line)}
.step:hover{background:var(--soft);border-color:var(--green)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;margin:18px 0 8px;cursor:pointer;touch-action:pan-y;
  background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;cursor:grab;
  background:radial-gradient(circle,#00573f 0 5px,#fff 6px);border:1.5px solid #b9d3c2;box-shadow:0 2px 6px #00573f33}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;cursor:grab;
  background:radial-gradient(circle,#00573f 0 5px,#fff 6px);border:1.5px solid #b9d3c2;box-shadow:0 2px 6px #00573f33}
input[type=range].unset::-webkit-slider-thumb{opacity:.55}
input[type=range].unset::-moz-range-thumb{opacity:.55}
.scale{display:flex;justify-content:space-between;gap:16px;font-size:.8rem;color:var(--muted)}
.scale span:last-child{text-align:right}
/* Gabor-Granger yes/no */
.ggrow .q{font-weight:500;margin:16px 0 6px}
.ggrow label.opt{display:inline-flex;justify-content:center;margin:4px 8px 4px 0;padding:10px 26px;font-size:1.05rem;font-weight:600;min-width:88px}
.ggrow label.opt input{display:none}
.end{text-align:center;padding:12px 0}
.end .big{font-size:2.4rem}
/* Phone: tighter card, full-width buttons, bigger tap targets */
@media (max-width:480px){
  main{padding:12px 10px 24px}
  .card{padding:18px 14px}
  .nav button{flex:1;padding:13px 10px}
  label.opt{padding:13px 12px}
}
</style>
</head>
<body>
<main id="app"></main>

  ["routine", "Pensez-vous que ce produit convient à une consommation quotidienne ?", AGREE7],

const photo = cls => `<img class="${cls}" src="${PHOTO[r.version]}" alt="Bouteille du produit, 50 cl">`;
// Product reminder shown above the price questions: photo + description.
const concept = () => `<div class="concept-box">${photo("thumb")}<p class="concept">« ${CONCEPT[r.version]} »</p></div>`;

let r, history;

function load() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } }
function save(list) { try { localStorage.setItem(STORE, JSON.stringify(list)); } catch {} }
const euro = (v, d = 3) => Number(v).toFixed(d).replace(".", ",") + " €";

// Unbiased random integer in [0, n) from the crypto RNG.
function randInt(n) { const a = new Uint32Array(1), lim = Math.floor(2 ** 32 / n) * n;
  do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; }
// Block randomisation: each block of 4 openings holds 2 A and 2 B in random order,
// so on a given device the split never drifts by more than 2. Falls back to a coin flip.
function assignVersion() {
  const KEY = "enquete_collagene_bloc";
  try {
    let bloc = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (!bloc.length) { bloc = ["A", "A", "B", "B"];
      for (let i = bloc.length - 1; i > 0; i--) { const j = randInt(i + 1); [bloc[i], bloc[j]] = [bloc[j], bloc[i]]; } }
    const v = bloc.shift(); localStorage.setItem(KEY, JSON.stringify(bloc)); return v;
  } catch { return randInt(2) ? "A" : "B"; }
}

function start() {
  r = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        version: assignVersion(), debut: new Date().toISOString(), statut: "en cours" };
  history = [];
  go("accueil", false);
}

// Uses the device clock, i.e. the respondent's own time zone.
function greeting() {
  const h = new Date().getHours();
  return h >= 5 && h < 12 ? "Bonne matinée" : h >= 12 && h < 21 ? "Bonne journée" : "Bonne nuit";
}

function finish(statut) {
  r.statut = statut; r.fin = new Date().toISOString();
  const list = load(); list.push(r); save(list);
  const msg = statut === "complet"
    ? `<div class="big">🙏</div><h1>Merci infiniment !</h1>
       <p>Vos réponses sont précieuses : elles vont directement nourrir notre étude et nous aider à mieux comprendre ce qui compte vraiment pour les consommateurs.</p>
       <p>Merci d’avoir pris ces quelques minutes, c’est grâce à des participants comme vous que cette enquête peut aboutir. ${greeting()} !</p>`
    : statut === "mineur"
    ? `<h1>Merci de votre intérêt</h1>
       <p>Cette étude est réservée aux personnes âgées de 18 ans et plus. Nous vous remercions de votre compréhension.</p>`
    : `<h1>Merci pour votre réponse</h1>
       <p>Nous respectons votre choix. ${greeting()} !</p>`;
  render(`<div class="end">${msg}</div>` + (ADMIN ? `<div class="nav"><button onclick="start()">Nouveau répondant</button>
    <button class="sec" onclick="exportCSV()">Exporter (CSV)</button></div>
    <p class="muted">${load().length} réponse(s) enregistrée(s) sur cet appareil.</p>` : ""));
}

// Screen order, used only for the progress bar.
const ORDER = ["accueil", "filtre", "offre", "controle", "vw", "gg", "perception0", "profil"];
function render(html, step = ORDER.length) {
  const pct = Math.round(step / ORDER.length * 100);
  document.getElementById("app").innerHTML = `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><div class="card">${html}</div>`;
  window.scrollTo(0, 0);
}

function radios(name, opts, sel) {
  return opts.map(o => `<label class="opt"><input type="radio" name="${name}" value="${o}"${o === sel ? " checked" : ""}> ${o}</label>`).join("");
}
function val(name) { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : null; }
const Q = (n, t) => `<div class="q"><b>Q${n}.</b> ${t}</div>`;

// Generic slider: starts "unset" (faded thumb) until moved; previous answers are restored.
const GAUGES = {};
function gauge(k, { min, max, step, init, fmt, ends }) {
  GAUGES[k] = fmt;
  const set = r[k] != null && r[k] !== "";
  return `<div class="gauge"><div class="row">
      <button type="button" class="step" aria-label="Diminuer" onclick="nudge('${k}', -1)">−</button>
      <div class="val${set ? "" : " unset"}" id="v_${k}">${set ? fmt(r[k]) : "Déplacez le curseur"}</div>
      <button type="button" class="step" aria-label="Augmenter" onclick="nudge('${k}', 1)">+</button></div>
    <input type="range" name="${k}" min="${min}" max="${max}" step="${step}" value="${set ? r[k] : init}" class="${set ? "" : "unset"}"
      oninput="upd(this)"${set ? ' data-set="1"' : ""}>
    <div class="scale"><span>${ends[0]}</span><span>${ends[1]}</span></div></div>`;
}
function upd(e) {
  e.classList.remove("unset"); e.dataset.set = 1;
  const v = document.getElementById("v_" + e.name); v.classList.remove("unset"); v.textContent = GAUGES[e.name](Number(e.value));
}
function nudge(k, d) {
  const e = document.querySelector(`input[name="${k}"]`);
  if (e.dataset.set) e.value = Math.round((Number(e.value) + d * Number(e.step)) * 100) / 100;
  upd(e);
}
const priceGauge = k => gauge(k, { min: COUT_REVIENT, max: 10, step: 0.1, init: COUT_REVIENT,
  fmt: v => euro(v, 2), ends: [euro(COUT_REVIENT, 2), "10,00 €"] });
const likertGauge = (k, text, scale, n) => Q(n, text) + gauge(k, { min: 1, max: scale.length, step: 1,
  init: Math.ceil(scale.length / 2), fmt: v => scale[v - 1], ends: [scale[0], scale[scale.length - 1]] });
const ggKey = p => "G_" + p.toFixed(2);
const positive = v => v === "Oui";
function ggRefresh() {
  let show = true;
  GG_PRICES.forEach((p, i) => { document.getElementById("gg" + i).hidden = !show;
    const v = val(ggKey(p)); show = show && !!v && !positive(v); });
}
function slider(name) { const e = document.querySelector(`input[name="${name}"]`); return e.dataset.set ? Number(e.value) : null; }

function go(name, push = true) {
  if (push) history.push(current);
  current = name;
  const s = screens[name];
  render(s.html() + `<div class="err" id="err"></div><div class="nav">
    ${history.length ? `<button class="sec" id="prev">← Précédent</button>` : "<span></span>"}<button id="next">Suivant →</button></div>`, ORDER.indexOf(name));
  if (s.after) s.after();
  document.getElementById("next").onclick = () => { const e = s.next(); if (e) document.getElementById("err").textContent = e; };
  const prev = document.getElementById("prev");
  if (prev) prev.onclick = () => { keep(); go(history.pop(), false); };
}
let current;

// Store whatever is filled on the current screen (no validation) so "Précédent" never loses an answer.
const KEYS = { consent: "consentement", genre: "genre", regime: "regime", depense: "depense_50cl" };
function keep() {
  document.querySelectorAll("input[type=radio]:checked").forEach(e => r[KEYS[e.name] || e.name] = e.value);
  document.querySelectorAll("input[type=range][data-set]").forEach(e => r[e.name] = Number(e.value));
}

const screens = {};
screens.perception0 = {
  html: () => `<p class="muted">Placez le curseur sur la réponse qui correspond le mieux à votre avis.</p>
    ${LIKERT_ITEMS.map(([k, q, sc], i) => likertGauge(k, q, sc, 11 + i)).join("")}`,
  next: () => { const v = LIKERT_ITEMS.map(([k]) => slider(k));
    if (v.some(x => x === null)) return "Merci de placer chaque curseur.";
    LIKERT_ITEMS.forEach(([k], i) => r[k] = v[i]); go("profil"); }
};
Object.assign(screens, {
  accueil: {
    html: () => `<h1>Enquête</h1><p>Cette enquête porte sur les boissons. Elle dure environ 5 minutes. Vos réponses sont anonymes et utilisées uniquement à des fins d’étude.</p>
      ${Q(1, "Acceptez-vous de participer ?")}${radios("consent", ["Oui", "Non"], r.consentement)}`,
    next: () => { const v = val("consent"); if (!v) return "Merci de répondre.";
      r.consentement = v; v === "Non" ? finish("refus") : go("filtre"); }
  },
  filtre: {
    html: () => `${Q(2, "Au cours des 3 derniers mois, avez-vous acheté de l’eau en bouteille ?")}${radios("F1", ["Oui", "Non"], r.F1)}
      ${Q(3, "Au cours des 3 derniers mois, avez-vous acheté au moins une fois une boisson ou un complément enrichi (vitamines, protéines, collagène…) ? <span class='muted'>Les boissons énergisantes (type Red Bull, Monster) ne sont pas concernées.</span>")}${radios("F2", ["Oui", "Non"], r.F2)}
      ${Q(4, "Quel est votre âge ?")}${gauge("F3", { min: 0, max: 100, step: 1, init: 0, fmt: v => v + " ans", ends: ["0 an", "100 ans"] })}`,
    next: () => { const f1 = val("F1"), f2 = val("F2"), f3 = slider("F3");
      if (!f1 || !f2 || f3 === null) return "Merci de répondre à toutes les questions.";
      Object.assign(r, { F1: f1, F2: f2, F3: f3 });
      f3 < 18 ? finish("mineur") : go("offre"); }
  },
  offre: {
    html: () => `<p>Voici un nouveau produit. <strong>Voici sa description, merci de la lire attentivement :</strong></p>
      <div class="bottle">${photo("hero")}</div><p class="concept">« ${CONCEPT[r.version]} »</p>`,
    next: () => go("controle")
  },
  vw: {
    html: () => `${concept()}<p class="muted">Faites glisser chaque curseur jusqu’au prix qui vous correspond (utilisez − et + pour ajuster de 10 centimes).</p>
      ${VW_ITEMS.map(([k, t], i) => Q(6 + i, t) + priceGauge(k)).join("")}`,
    next: () => { const p = VW_ITEMS.map(([k]) => slider(k));
      if (p.some(x => x === null)) return "Merci de placer chaque curseur sur un prix.";
      if (!(p[0] >= p[1] && p[1] >= p[2] && p[2] >= p[3]))
        return "Vos prix semblent incohérents : « trop cher » ≥ « cher » ≥ « bonne affaire » ≥ « trop bon marché ».";
      [r.P1, r.P2, r.P3, r.P4] = p; go("gg"); }
  },
  gg: {
    // Gabor-Granger on one page: next (lower) price appears only while the answer is not positive.
    html: () => `${concept()}${Q(10, "Pour chacun des prix suivants, indiquez si vous achèteriez ce produit.")}
      ${GG_PRICES.map((p, i) => `<div class="ggrow" id="gg${i}"><div class="q">${String.fromCharCode(97 + i)}) Achèteriez-vous ce produit au prix de ${euro(p, 2)} ?</div>
        ${radios(ggKey(p), GG_SCALE, r[ggKey(p)])}</div>`).join("")}`,
    after: () => { document.querySelectorAll(".ggrow input").forEach(e => e.onchange = ggRefresh); ggRefresh(); },
    next: () => { const shown = GG_PRICES.filter((p, i) => !document.getElementById("gg" + i).hidden);
      const last = shown[shown.length - 1], v = val(ggKey(last));
      if (!v) return "Merci de répondre.";
      GG_PRICES.forEach(p => r[ggKey(p)] = shown.includes(p) ? val(ggKey(p)) : "");
      r.GG_prix_accepte = positive(v) ? last : ""; go("perception0"); }
  },
  controle: {
    html: () => `${Q(5, "D’après la description, quelle est l’origine du collagène contenu dans ce produit ?")}
      ${radios("C1", ["Origine végétale", "Origine animale", "Origine marine", "Je ne sais pas"], r.C1)}`,
    next: () => { const v = val("C1"); if (!v) return "Merci de répondre.";
      r.C1 = v; r.controle_ok = (r.version === "A" ? v === "Origine végétale" : v === "Origine animale") ? 1 : 0;
      go("vw"); }
  },
  profil: {
    html: () => `${Q(18, "Vous êtes :")}${radios("genre", ["Une femme", "Un homme", "Autre", "Je préfère ne pas répondre"], r.genre)}
      ${Q(19, "Quel est votre régime alimentaire ?")}${radios("regime", ["Omnivore", "Flexitarien", "Végétarien", "Végan", "Autre"], r.regime)}
      ${Q(20, "Combien dépensez-vous habituellement pour une bouteille d’eau de 50 cl ?")}${radios("depense", ["Moins de 0,30 €", "De 0,30 € à 0,49 €", "De 0,50 € à 0,79 €", "De 0,80 € à 0,99 €", "De 1,00 € à 1,49 €", "De 1,50 € à 1,99 €", "2,00 € ou plus"], r.depense_50cl)}`,
    next: () => { const g = val("genre"), d = val("regime"), e = val("depense");
      if (!g || !d || !e) return "Merci de répondre à toutes les questions.";
      Object.assign(r, { genre: g, regime: d, depense_50cl: e }); finish("complet"); }
  }
});

function exportCSV() {
  // Q5 (control): correct answers first, then wrong ones, then incomplete questionnaires.
  const rank = x => x.controle_ok === 1 ? 0 : x.controle_ok === 0 ? 1 : 2;
  const list = load().map(x => ({ ...x, groupe_controle: ["Bonne réponse contrôle", "Erreur contrôle", "Non atteint"][rank(x)] }))
    .sort((a, b) => rank(a) - rank(b));
  if (!list.length) return;
  const cols = ["id", "version", "statut", "debut", "fin", "consentement", "F1", "F2", "F3", "P1", "P2", "P3", "P4",
    ...GG_PRICES.map(ggKey), "GG_prix_accepte", "C1", "controle_ok", "groupe_controle", ...LIKERT_ITEMS.map(([k]) => k),
    "genre", "regime", "depense_50cl"];
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = "﻿" + [cols.join(";"), ...list.map(x => cols.map(c => esc(x[c])).join(";"))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "reponses_enquete_collagene.csv"; a.click();
}

start();
</script>
</body>
</html>
